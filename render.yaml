# Render Blueprint — https://render.com/docs/blueprint-spec
# Connect repo at https://dashboard.render.com → New → Blueprint
services:
  - type: web
    name: karia
    runtime: node
    plan: free
    region: frankfurt
    # Install the whole workspace at the repo root, then build the web app.
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
